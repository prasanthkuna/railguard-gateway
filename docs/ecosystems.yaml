# Public ecosystem manifest.
# Canonical product-facing source: apps/site/lib/ecosystems.manifest.ts
# CI drift guard: bun run check:ecosystems-drift
version: 1
project:
  name: Railguard
  tagline: Agent money. Guarded.
  maturity: v0.1.0-alpha
  license: Apache-2.0 (Gateway, Failure Lab); MIT (protocol core, relicensing planned)

ecosystems:
  - id: x402
    label: x402
    status: adapter
    narrative: Pre-sign policy adapter inside the Railguard execution lifecycle.
    rails:
      - x402

  - id: coinbase-cdp
    label: Coinbase Developer Platform
    status: integrated
    evidence:
      - evidence/cdp-base-sepolia-live
      - evidence/arbitrum-sepolia
    narrative: Reference execution and reconciliation path via CDP.
    rails:
      - cdp
      - base

  - id: base
    label: Base
    status: testnet
    chains:
      - base-sepolia
    evidence:
      - evidence/cdp-base-sepolia-live
    rails:
      - base

  - id: arbitrum
    label: Arbitrum
    status: testnet
    chains:
      - arbitrum-sepolia
    evidence:
      - evidence/arbitrum-sepolia-hook
      - evidence/arbitrum-sepolia
    narrative: Sepolia hook deployment and separate external-wallet USDC settlement verification.
    rails:
      - arbitrum-sepolia

  - id: monad
    label: Monad
    status: testnet
    chains:
      - monad-testnet
    evidence:
      - evidence/monad-testnet
    narrative: External-wallet 1 USDC transfer independently matched from Monad testnet receipt logs.
    rails:
      - monad-testnet

  - id: arc
    label: Arc
    status: testnet
    chains:
      - arc-testnet
    narrative: Settlement-verification adapter is implemented; mainnet evidence is not yet claimed.
    rails:
      - arc-testnet
      - arc

  - id: stellar
    label: Stellar
    status: testnet
    evidence:
      - evidence/stellar-testnet
    narrative: Native testnet payment independently confirmed through Horizon.
    rails:
      - stellar

  - id: celo
    label: Celo
    status: grant-phase
    chains:
      - celo-alfajores
    narrative: Shared EVM settlement-verification path; no public live proof claimed yet.
    rails:
      - celo-alfajores
      - celo

  - id: airwallex
    label: Airwallex
    status: grant-phase
    narrative: Fiat execution adapter is a roadmap integration, not a shipped live rail.
    rails:
      - airwallex

  - id: failure-lab
    label: Failure Lab
    status: shipped
    repo: agent-payment-failure-lab
    atlas: https://github.com/prasanthkuna/agent-payment-failure-lab/tree/main/atlas

adapters:
  registry: packages/integrations/src/rails/registry.ts
  kernel: packages/kernel/src/adapters.ts
  resolve_network: resolveRailForNetwork
