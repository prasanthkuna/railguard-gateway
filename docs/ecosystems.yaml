# Grant / ecosystem one-pager (plan28.1).
# Canonical site cards + /ecosystems pages: apps/site/lib/ecosystems.manifest.ts
# CI: bun run check:ecosystems-drift
version: 1
project:
  name: Railguard
  tagline: Agent money. Guarded.
  maturity: v0.1.0-alpha
  license: Apache-2.0 (Gateway, Failure Lab); MIT (protocol core, relicensing planned)

ecosystems:
  - id: coinbase-cdp
    label: Coinbase Developer Platform
    status: integrated
    evidence:
      - evidence/cdp-base-sepolia-live
      - evidence/arbitrum-sepolia
    narrative: Reference execution + reconciliation on Base Sepolia via CDP.
    rails:
      - cdp
      - base

  - id: base
    label: Base
    status: testnet
    chains:
      - base-sepolia
    evidence:
      - evidence/cdp-base-sepolia-live
    rails:
      - base

  - id: stellar
    label: Stellar
    status: testnet
    evidence:
      - evidence/stellar-testnet
    rails:
      - stellar

  - id: arbitrum
    label: Arbitrum
    status: testnet
    chains:
      - arbitrum-sepolia
    evidence:
      - evidence/arbitrum-sepolia-hook
      - evidence/arbitrum-sepolia
    narrative: Sepolia hook deploy (Track A) + external-wallet USDC verification (Track B).
    rails:
      - arbitrum-sepolia

  - id: x402
    label: x402
    status: adapter
    repo: x402-guard
    narrative: Execution rail adapter inside Gateway kernel — not a separate product.
    rails:
      - x402

  - id: failure-lab
    label: Failure Lab
    status: shipped
    repo: agent-payment-failure-lab
    atlas: https://github.com/prasanthkuna/agent-payment-failure-lab/tree/main/atlas

adapters:
  registry: packages/integrations/src/rails/registry.ts
  kernel: packages/kernel/src/adapters.ts
  resolve_network: resolveRailForNetwork
