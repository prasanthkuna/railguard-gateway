name: README Proofs

# Rebuilds the proof table in README.md and .github/badges/proofs.json from evidence/.
# Commits only when the output changed. Commits made with GITHUB_TOKEN do not trigger
# new workflow runs, and the bot actor is skipped as well, so this cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "scripts/readme-proofs.ts"
      - "README.md"
      - ".github/workflows/readme-proofs.yml"
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-proofs
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Regenerate proof table
        run: bun run scripts/readme-proofs.ts
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md .github/badges/proofs.json; then
            echo "Proof table already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/badges/proofs.json
          git commit -m "docs(readme): regenerate proof table from evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
