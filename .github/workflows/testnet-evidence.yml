name: Testnet Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  base-sepolia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bun install
      - name: Base Sepolia settlement evidence
        # Optional private RPC; the script falls back to public Base Sepolia RPCs
        # with retries and backoff when this secret is unset.
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: bun run testnet-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-evidence
          path: evidence/base-sepolia-live.json
